name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Restore Missing Gradle Files
        run: |
          mkdir -p gradle/wrapper
          curl -sLo gradlew https://raw.githubusercontent.com/RafhaanShah/8BallPoolOverlay/master/gradlew
          curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/RafhaanShah/8BallPoolOverlay/master/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
